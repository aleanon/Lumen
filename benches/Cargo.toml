[package]
name = "lumen-benches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The lib is just a host for the bench targets; don't run it as a bench (its
# default libtest harness rejects criterion's CLI flags).
bench = false

[dependencies]
lumen-core = { workspace = true }
lumen-layout = { workspace = true }
lumen-render = { workspace = true }
lumen-widgets = { workspace = true }
lumen-app = { workspace = true }
kurbo = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "perf"
harness = false

[[bench]]
name = "identity"
harness = false

# N0 measurement suite (docs/plan-incremental-path.md; born testing the retired
# docs/plan-node-cost.md): allocation counts per frame,
# the missing O(changed) bench, and scope-count scaling.
[[bench]]
name = "nodecost"
harness = false

# Cache-residency probe for the build_node drift (docs/build-node-drift.md).
# Not a gate: it prints a table for a one-off comparison against a padded
# Element, and there is no ratio here that CI could hold to.
[[bench]]
name = "buildscale"
harness = false

# WT-EXP: the typed-widget-layer cost, isolated. Paired with the
# `widgetprobe` binary (allocations, sizes, RSS).
[[bench]]
name = "widgetcost"
harness = false

# WT-EXP: Element-staging vs writing straight into the tree.
[[bench]]
name = "lowercost"
harness = false
