[package]
name = "lumen-shell-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "lumen_shell_android"

[features]
# Forwarded tiers (GX3). Default preserves today's behaviour exactly;
# `--no-default-features` is what makes a lean build of this platform reachable.
default = ["snapshot", "complex-scripts"]
pan-unicode = ["lumen/pan-unicode"]
complex-scripts = ["lumen/complex-scripts"]
snapshot = ["lumen/snapshot"]

[dependencies]
# Direct path deps, defaults OFF. `{ workspace = true }` silently ignores
# `default-features = false`, so any default-featured link in this chain
# re-enables the 15.5 MB pan-Unicode face for every consumer downstream.
lumen = { path = "../lumen", default-features = false }
lumen-core = { workspace = true }
lumen-render = { workspace = true }

[dev-dependencies]
kurbo = { workspace = true }

# Android-only: the native-activity glue, NativeWindow blit, and logging.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { workspace = true, features = ["native-activity"] }
ndk = { workspace = true }
log = { workspace = true }
android_logger = { workspace = true }
