[package]
name = "lumen-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# GPU backend, forwarded to lumen-render (default-on). Gates the ShaderWidget;
# `--no-default-features` drops it (build the crate directly for the effect).
# `snapshot` (default-on): the serializable / introspectable surfaces —
# AppSnapshot restore, `semantics_json`, `get_styles`, and the `design` import.
# Forwards to lumen-core / lumen-style; a lean GPU app builds with
# `--no-default-features --features wgpu` and drops `serde_json` app-wide.
# `pan-unicode` (LN2: default-OFF): the full 15 MB embedded face (CJK/RTL/Indic);
# lean builds embed the ~350 KB Latin+symbols subset (T.4).
default = ["wgpu", "snapshot", "codecs", "complex-scripts", "dev-observability", "accessibility"]
# O0.1: the per-frame ambient audit (see lumen-core). Default-on so `cargo run`
# has it and a `--no-default-features` release build does not.
dev-observability = ["lumen-app/dev-observability"]
# ADR-M1: jpeg/gif/webp decode (`asset::decode`/`asset::animation`). Off in
# the lean profile — PNG always works via tiny-skia.
codecs = ["dep:image"]
wgpu = ["lumen-render/wgpu", "lumen-app/wgpu"]
snapshot = ["dep:serde_json", "lumen-core/snapshot", "lumen-style/snapshot", "lumen-app/snapshot"]
pan-unicode = ["lumen-text/pan-unicode", "lumen-app/pan-unicode"]
complex-scripts = ["lumen-text/complex-scripts", "lumen-app/complex-scripts"]
# A11Y1: publish the semantics tree to the OS accessibility layer (AccessKit —
# AT-SPI/D-Bus on Linux, UIA on Windows). Default ON.
#
# This gates the PUBLISHER, not the tree. `SemanticsNode` is Lumen's
# observability contract — the agent protocol, `ui.lint`, `lumen-test` and the
# golden ladder all read it — so it is never gated and never optional. Turning
# this off removes the OS bridge and its D-Bus stack, and changes nothing a
# test or the agent can see.
accessibility = ["dep:accesskit"]

[dependencies]
# ADR-M1: optional raster codecs (jpeg/gif/webp), pure-Rust decoders.
image = { workspace = true, optional = true }
# SD1: the runtime, re-exported so `crate::app`/`crate::element` paths
# inside this crate and every downstream `lumen_widgets::app` path keep working.
lumen-app = { path = "../lumen-app", default-features = false }
lumen-core = { workspace = true }
lumen-macros = { workspace = true }
# Direct path dep, defaults OFF: `{ workspace = true }` silently ignores
# `default-features = false`, and lumen-render defaults to `wgpu`. One such
# link anywhere in the chain keeps the GPU backend in the graph, which is
# what stopped the no-GPU profile from actually being no-GPU (ADR-003
# amendment). The `wgpu` feature above forwards it when wanted.
lumen-render = { path = "../lumen-render", default-features = false }
lumen-layout = { workspace = true }
lumen-text = { workspace = true }
lumen-style = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }
