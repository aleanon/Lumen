# SD1: the application RUNTIME, extracted from lumen-widgets.
#
# lumen-widgets had grown to hold two unrelated things: a 4.6k-line runtime
# (build → reconcile → layout → paint → semantics) and a ~9k-line widget
# catalogue. They change for different reasons and are read by different people,
# and the runtime is where the performance work lands — so it now compiles,
# tests and is reviewed on its own.
#
# The dependency runs ONE WAY: lumen-widgets depends on lumen-app and
# re-exports it. The runtime knows nothing about buttons.
[package]
name = "lumen-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["wgpu", "snapshot", "complex-scripts", "dev-observability"]
wgpu = ["lumen-render/wgpu"]
# O0.1: see lumen-core. Forwarded so the primitives and the audit are gated
# together -- O0.2's types live in lumen-core, O0.3's loop lives here.
dev-observability = ["lumen-core/dev-observability"]
snapshot = ["dep:serde_json", "lumen-core/snapshot", "lumen-style/snapshot"]
pan-unicode = ["lumen-text/pan-unicode"]
complex-scripts = ["lumen-text/complex-scripts"]

[dependencies]
lumen-core = { workspace = true }
# Direct path dep, defaults OFF: `{ workspace = true }` silently ignores
# `default-features = false`, and lumen-render defaults to `wgpu`. One such
# link anywhere in the chain keeps the GPU backend in the graph, which is
# what stopped the no-GPU profile from actually being no-GPU (ADR-003
# amendment). The `wgpu` feature above forwards it when wanted.
lumen-render = { path = "../lumen-render", default-features = false }
lumen-layout = { workspace = true }
lumen-text = { workspace = true }
lumen-style = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
accesskit = { workspace = true }
