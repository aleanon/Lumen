[package]
name = "lumen-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lumen-core = { workspace = true }
# CPU-side types only (RgbaImage, display list) — never the GPU stack.
# Direct path dep, defaults OFF: `{ workspace = true }` silently ignores
# `default-features = false`, and lumen-render defaults to `wgpu`. One such
# link anywhere in the chain keeps the GPU backend in the graph, which is
# what stopped the no-GPU profile from actually being no-GPU (ADR-003
# amendment). The `wgpu` feature above forwards it when wanted.
lumen-render = { path = "../lumen-render", default-features = false }
kurbo = { workspace = true }
# TextEditor is persisted in a Signal<T> (State = Serialize + DeserializeOwned).
serde = { workspace = true }
# Shaping/layout (parley) + scaling/rasterization (swash), ADR-005.
parley = { workspace = true }
swash = { workspace = true }

[features]
# T.4: the default embedded face is the full pan-Unicode Go Noto Kurrent
# (~15 MB — CJK/RTL/Indic goldens and the i18n examples rely on it). The
# lean build (--no-default-features, the shipped profile) embeds the
# ~350 KB Latin+symbols subset instead; register a full face at runtime
# with `App::font(bytes)` when a lean app needs wider coverage.
default = []
pan-unicode = []
# The ICU dictionary segmenter (`cjdict`). Costs **3.62 MB** — 69% of Lumen's
# binary-size gap against iced — and buys Thai/Lao/Khmer/Burmese line breaking
# plus word-granularity cursor movement and double-click selection in CJK.
#
# It does NOT affect CJK line WRAPPING, which is identical without it
# (`cargo run -p lumen-text --example cjk_probe --features pan-unicode`).
# Default-on through every consumer, so nothing changes unless an app opts out.
complex-scripts = ["parley/complex-scripts"]

[dev-dependencies]
# Editor serde round-trip test (matches the Signal<T> JSON storage format).
serde_json = { workspace = true }
