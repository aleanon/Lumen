[package]
name = "lumen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# GPU backend (`wgpu`), forwarded down the stack. Default-on; gates the
# facade's ShaderWidget re-export. (Web/mobile drop wgpu via target-gating in
# lumen-render regardless; the CPU-only renderer build is `lumen-render
# --no-default-features`.)
default = ["wgpu", "snapshot", "desktop-integration", "complex-scripts", "accessibility"]
wgpu = ["lumen-widgets/wgpu", "lumen-render/wgpu", "lumen-shell/wgpu"]
# The serializable/introspectable surfaces (AppSnapshot, get_styles, agent
# JSON) — default-on; the lean shipped profile drops it (02 §4 doctrine).
snapshot = ["lumen-widgets/snapshot", "lumen-shell/snapshot"]
# T.4/LN2: the full 15 MB pan-Unicode embedded face — **default-OFF** since
# LN2. The default build embeds the ~350 KB Latin+symbols subset, which is
# everything the built-in widgets draw; an app that renders CJK/RTL/Indic either
# turns this on or registers a wider face at runtime with `App::font`.
#
# Flipped because the face is ~14.5 MB of the binary and the ~95% of apps that
# never render those scripts were paying for it. Measured on hello_android:
# 22.8 MB -> 7.0 MB. Safe to flip without a deprecation window because every
# crate here is `publish = false` at 0.1.0 — there is no downstream consumer to
# break, and after 1.0 there would have been.
pan-unicode = ["lumen-widgets/pan-unicode", "lumen-shell/pan-unicode"]
complex-scripts = ["lumen-widgets/complex-scripts", "lumen-shell/complex-scripts"]
accessibility = ["lumen-widgets/accessibility", "lumen-shell/accessibility"]
# The live-window agent endpoint (JSON-RPC on LUMEN_AGENT_ADDR) — default-off,
# forwarded to the desktop shell. Scaffolded apps use it via `just run-agent`.
agent = ["lumen-shell/agent"]
# GX2: native file dialogs, menus and tray. Default ON. Turning it off drops
# the entire Linux GTK cluster (rfd + muda + tray-icon + gtk); the constrained
# profile CFG1 targets is built this way.
desktop-integration = ["lumen-shell/desktop-integration"]
# EX: run background work on a real async runtime. Default-OFF, and the runtime
# crates are optional dependencies OF AN OPTIONAL CRATE — so a default build has
# neither tokio nor smol anywhere in its graph. `lumen::exec` appears only when
# one of these is on.
exec-tokio = ["dep:lumen-exec", "lumen-exec/tokio"]
exec-smol = ["dep:lumen-exec", "lumen-exec/smol"]

[dependencies]
lumen-core = { workspace = true }
# Direct path dep with `default-features = false`, per the GX3 rule — Cargo
# ignores that key on a workspace-inherited dependency, and this one gates
# whether tokio/smol exist in the graph at all.
lumen-exec = { path = "../lumen-exec", default-features = false, optional = true }
lumen-render = { workspace = true }
lumen-layout = { workspace = true }
lumen-text = { workspace = true }
lumen-style = { workspace = true }
# Direct path dep (not workspace-inherited): `default-features = false` on a
# `workspace = true` dep is silently ignored by cargo, which would make the
# lean profile impossible — the facade's own defaults re-enable everything.
lumen-widgets = { path = "../lumen-widgets", default-features = false }

# The desktop window shell (winit) is desktop-only; mobile + web targets use
# their own shells (lumen-shell-android / -ios / -web), so excluding it here
# keeps winit → android-activity out of those builds.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
# Direct path dep, defaults off. Cargo IGNORES `default-features = false` on a
# workspace-inherited dependency, so `lumen-shell = { workspace = true }` would
# silently keep `desktop-integration` (and with it the whole GTK cluster) even
# under `--no-default-features`. Same trap already documented for lumen-widgets
# in crates/lumen-shell/Cargo.toml.
lumen-shell = { path = "../lumen-shell", default-features = false }
