[package]
name = "lumen-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lumen-core = { workspace = true }
# EXPLAIN1: ui.explain names PARSE_ONLY_PROPERTIES/KNOWN_PROPERTIES so it can
# tell an agent that a property parses but is never applied.
lumen-style = { workspace = true }
# Direct path dep, defaults OFF. As a `{ workspace = true }` link this crate
# was the last one re-enabling `lumen-widgets`'s defaults (and with them the
# 15.5 MB pan-Unicode face) for every platform shell that depends on the agent
# bridge — even when the consumer, the shell, and the shared shell core had all
# already been switched to defaults-off.
lumen-widgets = { path = "../lumen-widgets", default-features = false, features = ["snapshot"] }
kurbo = { workspace = true }
serde_json = { workspace = true }
# Sync WebSocket so the non-Send app stays on the serving thread (ADR-003,
# ADR-018: tokio is only for the dev-server multiplexer, not this loop).
# Optional (P.2): the wasm agent bridge needs only `dispatch` — the browser
# side owns the transport — and tungstenite's dep tree doesn't build on
# wasm32-unknown-unknown.
tungstenite = { workspace = true, optional = true }

[features]
default = ["ws", "complex-scripts"]
# Forwarded tier (GX3), so a lean platform shell can actually reach lean.
# NOTE `snapshot` is NOT forwardable: the agent bridge IS the JSON surface
# (`semantics_json`, `get_styles`), so lumen-widgets/snapshot is a hard
# requirement here rather than a tier — it is requested unconditionally above.
pan-unicode = ["lumen-widgets/pan-unicode"]
complex-scripts = ["lumen-widgets/complex-scripts"]
# The native WebSocket serving loop (serve_one/serve_one_session).
ws = ["dep:tungstenite"]

[dev-dependencies]
proptest = { workspace = true }
lumen-layout = { workspace = true }
