[package]
name = "lumen-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# `snapshot` (default): the serializable / introspectable build. Stored signal
# values gain a `Serialize + DeserializeOwned` bound so the store can be
# checkpointed to field-tagged JSON (ADR-011) and the semantics tree serialized
# for the agent. Turn it off (`--no-default-features`) for a lean build: the
# `State` bound relaxes to `'static`, per-value JSON goes away, and `serde_json`
# leaves the dependency tree. `snapshot` is the canonical superset built in CI;
# lean is the optimized subset that ships.
default = ["snapshot", "dev-observability"]
snapshot = ["dep:serde_json"]
# O0.1: the per-frame ambient audit and the occlusion scan — the only two
# observability paths expensive enough to need a gate. Everything else in the
# O phase is a latched boolean or a one-shot line, the same cost as the
# always-on `atlas_overflow` latch in the GPU backend, and ships ungated.
#
# Deliberately NOT tied to `snapshot`: these checks are pure Rust over
# already-computed layout and paint state and need no `serde_json`. (An earlier
# draft justified the split by "a lean build with an agent attached", which is
# not a real configuration -- lumen-agent hard-requires lumen-widgets/snapshot
# and the decision log states "a lean build implies no agent".)
dev-observability = []

[dependencies]
kurbo = { workspace = true }
smol_str = { workspace = true, features = ["serde"] }
bitflags = { workspace = true }
serde = { workspace = true }
# Self-describing field-tagged JSON (ADR-011) for the state snapshot + the
# semantics doc. Only linked in a `snapshot` build.
serde_json = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
jsonschema = { workspace = true }
# Tests always exercise the JSON paths (default features are on for `cargo test`).
serde_json = { workspace = true }
