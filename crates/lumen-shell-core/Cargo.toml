# MOD5: the platform-agnostic half of a shell.
#
# `lumen-shell-ios` and `lumen-shell-web` had grown byte-identical copies of the
# same logic. Duplication across platform shells is the kind that rots quietly:
# a fix lands on the platform whose bug was reported, and the other keeps the
# defect until someone happens to hit it there too.
[package]
name = "lumen-shell-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Forwarded tiers. Default preserves the previous behaviour exactly, so no
# existing consumer changes; `--no-default-features` is what lets a platform
# shell (notably wasm, where size is a distribution constraint) go lean.
default = ["snapshot", "complex-scripts"]
pan-unicode = ["lumen/pan-unicode"]
complex-scripts = ["lumen/complex-scripts"]
snapshot = ["lumen/snapshot"]

[dependencies]
# Direct path dep, defaults OFF. `lumen = { workspace = true }` silently
# ignores `default-features = false`, and because every platform shell reaches
# `lumen` THROUGH this crate, that one line pinned the 15.5 MB pan-Unicode face
# into every wasm build no matter what the consumer asked for.
lumen = { path = "../lumen", default-features = false }
lumen-core = { workspace = true }
lumen-render = { workspace = true }
kurbo = { workspace = true }

[dev-dependencies]
lumen-widgets = { workspace = true }
