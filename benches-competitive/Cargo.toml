# Competitive benchmark harness (BENCH1).
#
# Its OWN workspace, excluded from the root one, so foreign UI toolkits never
# enter Lumen's dependency graph, Cargo.lock, or cargo-deny closure. ADR-003's
# whitelist governs the framework; this crate is a measuring instrument that
# happens to link the things being measured against.
[workspace]

[package]
name = "lumen-competitive-benches"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
lumen-widgets = { path = "../crates/lumen-widgets" }
lumen-core = { path = "../crates/lumen-core" }
# For `Dim` in the subtractive phase probe (src/bin/probe_phases.rs).
lumen-layout = { path = "../crates/lumen-layout" }
# For pricing the per-node primitives in src/bin/probe_ops.rs.
taffy = "0.13"
# Same FxHash construction lumen-app uses for its per-node side tables
# (crate::fxhash is pub(crate), so it cannot be imported here).
rustc-hash = "2"
# For `NullRenderer`: the harness supplies its own `Renderer` so the Lumen side
# stops at the display list, matching where egui's `tessellate()` stops.
lumen-render = { path = "../crates/lumen-render", default-features = false }
# MUST track the root workspace's kurbo (root Cargo.toml). This is its own
# workspace with its own lockfile, so a bump there does not reach here — and
# the mismatch surfaces as `expected lumen_core::geometry::Size, found
# kurbo::Size`, because lumen-core re-exports the kurbo types as its public
# geometry. That is exactly what a downstream app sees; this harness was
# already broken by the 0.11 -> 0.13 bump before anyone ran it.
kurbo = "0.13"

# `egui` core only — deliberately NOT `eframe`, which would drag in winit/wgpu
# and measure a windowing stack rather than the framework's build+layout cost.
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }

# iced, driven at the widget layer rather than through `iced::application`,
# which would pull winit+wgpu and measure a windowing stack.
#
# `iced_tiny_skia` is the renderer deliberately: its `text::Renderer` has a
# REAL `Paragraph` backed by cosmic-text, so iced shapes text like Lumen does.
# The obvious alternative — iced_core's built-in null renderer, `impl Renderer
# for ()` — sets `type Paragraph = ()`, making text shaping a NO-OP. Measuring
# an N-row text list against that would have compared Lumen's parley/swash
# shaping to iced doing nothing, which is the same class of unfairness the
# 2026-08-09 stopping-point correction fixed for egui.
iced_core = "0.14"
iced_widget = "0.14"
iced_tiny_skia = "0.14"
# Pulled in transitively by iced_widget; it refuses to build in release mode
# without a backend feature, and `tiny-skia` is the one that keeps this a
# CPU-only, windowless measurement (the alternative, `wgpu`, would drag in a
# GPU stack neither side is being timed on).
iced_renderer = { version = "0.14", default-features = false, features = ["tiny-skia"] }

# masonry is Xilem's widget/layout layer, and its `testing` feature ships the
# TestHarness Xilem itself uses. `render()` builds a vello `Scene` and only
# then rasterizes on the GPU — and honours SKIP_RENDER_TESTS to stop after the
# scene, which is the matched stopping point (Lumen's display list, iced's
# primitives).
masonry = { version = "0.4", features = ["testing"] }
vello = "0.6"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vs_egui"
harness = false

[[bench]]
name = "vs_iced"
harness = false

[[bench]]
name = "vs_toolkits"
harness = false

# Match the root workspace's release profile so Lumen is measured with the
# optimizations it actually ships with (root Cargo.toml [profile.release]).
# Without this the harness silently benchmarks a differently-compiled Lumen
# than users get. egui gets the same treatment, so neither side is advantaged.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
