name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast lints run once on Linux only.
  lint:
    name: fmt + clippy + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Build + test on all three desktop OSes (00 environment assumptions).
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace
      - name: doc tests
        run: cargo test --workspace --doc

  # LN0: the lean (`--no-default-features`) profile must actually compile.
  #
  # The `test` job cannot cover this. `cargo build --workspace` unifies features
  # across all ~70 members, and 46 of 51 examples request full-default
  # `lumen-widgets`, so the lean code paths are never compiled there — they were
  # only ever exercised by a throwaway crate built OUTSIDE the workspace in
  # scripts/size_gate.sh, which never ran tests against it.
  #
  # This is not hypothetical. Two consecutive commits (OB3, SD6a) each landed a
  # break that the default profile compiled and tested cleanly: a dead-type
  # warning under -D warnings, and six borrow errors. Both would have shipped.
  #
  # Each crate is checked ALONE (`-p <crate>`), because checking several at once
  # re-introduces the unification this job exists to defeat.
  #
  # SCOPE: two tiers, because the crates are not in the same state.
  #
  # Six crates now compile lean WITH their tests: the handful of genuinely
  # snapshot-specific tests were cfg-gated rather than made profile-agnostic,
  # since a test whose whole subject is the JSON export has nothing left of it
  # without `snapshot`. Those get `--all-targets`, so a lean break in test code
  # is caught too.
  #
  # lumen-widgets, lumen-shell and the facade stay lib-only: lumen-widgets has
  # 27 such errors and triaging them is real work — some of those tests exist
  # precisely to exercise snapshot behavior and should be gated, others are
  # incidental and could be made profile-agnostic, which is added coverage
  # rather than bookkeeping. The lib is what ships, so the lib is gated
  # everywhere; the remainder is tracked.
  lean:
    name: lean profile (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: check each crate with default features off
        run: |
          set -euo pipefail
          # Tier 1: lib + tests.
          for crate in lumen-core lumen-style lumen-text lumen-render \
                       lumen-layout lumen-shell-core; do
            echo "==> $crate (lean, with tests)"
            cargo check -p "$crate" --no-default-features --all-targets
          done
          # Tier 2: lib only (see the note above).
          for crate in lumen-app lumen-widgets lumen-shell lumen; do
            echo "==> $crate (lean, lib only)"
            cargo check -p "$crate" --no-default-features
          done

  # GX0/GX1: exercise the GPU renderer in CI via lavapipe (Mesa's software
  # Vulkan), so the backend users actually see gets tested without buying a
  # GPU runner.
  #
  # BLOCKING as of 2026-08-10. It was non-blocking because the parity suite
  # "failed under lavapipe, which renders gradient_linear as a blank frame".
  # That diagnosis was wrong: `VK_ICD_FILENAMES` constrains VULKAN ONLY, so
  # pointing it at lavapipe removed the NVIDIA *Vulkan* adapter and let NVIDIA
  # *GL* win the selection — and it is the GL backend that returns zeros from
  # `textureSample` of the gradient ramp. On real lavapipe the scene matches the
  # CPU better than any other in the corpus (docs/gl-gradient-defect.md).
  # `Wgpu::new` now prefers PRIMARY backends, and every render suite passes on
  # lavapipe, so red here means broken rather than mis-attributed.
  #
  # Runs lumen-widgets too. Those GPU tests existed but were in NO job, which is
  # structurally why an oversize-texture panic could ship: headless tests use the
  # CPU renderer, which has no texture-dimension concept at all, so the crash was
  # invisible to everything except a live window.
  gpu:
    name: gpu renderer (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: renderer + widget GPU tests on a software adapter
        env:
          # Fail rather than self-skip: a GPU job that silently no-ops when the
          # driver is missing reports green while proving nothing.
          LUMEN_REQUIRE_GPU: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: cargo test -p lumen-render -p lumen-widgets --features wgpu

  # LN1: the two DERIVED font faces must be reproducible from their sources.
  #
  # Both shipped as untracked pyftsubset output — the recipe existed only in
  # someone's shell history, so the committed bytes could not be audited or
  # re-cut. The ranges were recovered from the artifacts' own cmap coverage and
  # verified to regenerate both files with identical SHA-256s.
  #
  # This is a supply-chain check as much as a size one: it proves the shipped
  # faces are exactly a documented subset of the sources they claim, and nothing
  # else. Pinned to fontTools 4.63.0 because subsetter output is version-
  # dependent — a floating version would make this fail for the wrong reason.
  fonts:
    name: font subsets reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install fontTools + the DejaVu source
        run: |
          pip install --quiet fonttools==4.63.0
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: verify
        run: ./scripts/subset_fonts.sh verify
      # LN2: the pan-Unicode face is opt-in, so the CJK/RTL goldens are gated on
      # the feature. They still have to RUN somewhere, or making the face
      # optional would quietly delete the i18n coverage instead of relocating
      # it. This is that somewhere.
      - uses: dtolnay/rust-toolchain@stable
      - name: i18n goldens (CJK/RTL, needs the pan-Unicode face)
        run: cargo test -p lumen-text --features pan-unicode

  # Perf gate (T2.6): criterion benches must stay within their frame budgets.
  # Runs on the reference Linux desktop runner only.
  perf:
    name: perf gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: perf budgets
        run: ./scripts/perf_gate.sh
      - name: cold start + memory gates (R.6)
        run: ./scripts/cold_start_gate.sh
      - name: size gates (R.4/R.6, default + lean profiles)
        run: ./scripts/size_gate.sh
