name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast lints run once on Linux only.
  lint:
    name: fmt + clippy + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Build + test on all three desktop OSes (00 environment assumptions).
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace
      - name: doc tests
        run: cargo test --workspace --doc

  # LN0: the lean (`--no-default-features`) profile must actually compile.
  #
  # The `test` job cannot cover this. `cargo build --workspace` unifies features
  # across all ~70 members, and 46 of 51 examples request full-default
  # `lumen-widgets`, so the lean code paths are never compiled there — they were
  # only ever exercised by a throwaway crate built OUTSIDE the workspace in
  # scripts/size_gate.sh, which never ran tests against it.
  #
  # This is not hypothetical. Two consecutive commits (OB3, SD6a) each landed a
  # break that the default profile compiled and tested cleanly: a dead-type
  # warning under -D warnings, and six borrow errors. Both would have shipped.
  #
  # Each crate is checked ALONE (`-p <crate>`), because checking several at once
  # re-introduces the unification this job exists to defeat.
  #
  # SCOPE: library targets only, deliberately — no `--all-targets`. Several test
  # targets are legitimately snapshot-specific without being cfg-gated (e.g.
  # lumen-core's semantics tests call the snapshot-only `to_json`; lumen-widgets
  # has 27 such errors). Making the test suites lean-compatible is real work and
  # partly undesirable — some of those tests exist precisely to test snapshot
  # behavior. The lib target is what actually ships, so that is what is gated
  # here; extending to test targets is tracked separately.
  lean:
    name: lean profile (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: check each crate with default features off
        run: |
          set -euo pipefail
          for crate in lumen-core lumen-style lumen-text lumen-render \
                       lumen-layout lumen-widgets lumen-shell lumen; do
            echo "==> $crate (lean)"
            cargo check -p "$crate" --no-default-features
          done

  # GX0/GX1: exercise the GPU renderer in CI via lavapipe (Mesa's software
  # Vulkan), so the backend users actually see gets tested without buying a
  # GPU runner.
  #
  # NON-BLOCKING ON PURPOSE (continue-on-error). Evaluating this on 2026-08-08
  # falsified the assumption it was scheduled on: the CPU/GPU parity suite
  # passes on a real NVIDIA adapter but FAILS under lavapipe, which renders
  # `gradient_linear` as a completely blank frame (identical to the blank
  # reference, while differing from the CPU render by 23 400 px). Whether that
  # is a lavapipe limitation or a portability bug in Lumen's gradient encoding
  # is unresolved — a conformant software implementation rendering nothing is
  # worth knowing either way, so the job collects the signal instead of
  # pretending the platform is covered.
  #
  # Make this a required check once the gradient issue is resolved; until then
  # a real (self-hosted) GPU runner is the only way to gate the GPU path.
  gpu:
    name: gpu renderer (lavapipe, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: renderer tests on a software adapter
        env:
          # Fail rather than self-skip: a GPU job that silently no-ops when the
          # driver is missing reports green while proving nothing.
          LUMEN_REQUIRE_GPU: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: cargo test -p lumen-render --features wgpu

  # Perf gate (T2.6): criterion benches must stay within their frame budgets.
  # Runs on the reference Linux desktop runner only.
  perf:
    name: perf gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: perf budgets
        run: ./scripts/perf_gate.sh
      - name: cold start + memory gates (R.6)
        run: ./scripts/cold_start_gate.sh
      - name: size gates (R.4/R.6, default + lean profiles)
        run: ./scripts/size_gate.sh
