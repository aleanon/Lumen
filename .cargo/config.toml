# 32-way parallel LLVM debug builds exceed this box's memory (62 GiB, swap
# 2 GiB): rustc hit "LLVM ERROR: out of memory", and memory-pressure kills
# mid-write are the prime suspect for three target/-and-.git corruption
# waves (2026-07-10). Bound build parallelism; raise if the workspace or
# the machine changes.
[build]
jobs = 12

# Disk-pressure mitigation (2026-07-11, after the third 100%-full incident: a
# day of dev cycles regrew target/ to 151 GB). Incremental caches were both
# multi-GB and the corruption-prone artifact class. The other half of that
# mitigation — line-tables-only debuginfo — lives in `[profile.dev]` in the
# root Cargo.toml.
#
# CORRECTED 2026-08-17: this was written as `[env] CARGO_INCREMENTAL = "0"`
# and never did anything for fifteen months. Cargo's `[env]` table sets
# variables in the environment of the build scripts and binaries cargo
# *invokes*; it does not configure cargo's own behaviour, and cargo reads
# CARGO_INCREMENTAL from its real process environment. The setting that works
# is this one. Found when target/debug/incremental had quietly grown to 19 GB
# and filled the disk mid-build; deleting it cost nothing, because nothing
# here wants incremental compilation in the first place.
incremental = false
